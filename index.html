<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <!-- Oscuro desde el primer byte: sin esto la página parpadea en blanco antes del boot. -->
    <style>html,body{background:#0b0d17;color-scheme:dark}</style>
    <meta name="description" content="Carlos Rábago — Desarrollador Frontend e Ingeniero Industrial en Madrid. Interfaces web modernas, dinámicas e interactivas con React, GSAP, Three.js y WordPress para marcas líderes." />
    <link rel="canonical" href="https://carlos-rabago.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carlos-rabago.netlify.app/" />
    <meta property="og:title" content="Carlos Rábago — Desarrollador Frontend e Ingeniero Industrial" />
    <meta property="og:description" content="Interfaces web con React, GSAP y Three.js para marcas como Mahou, Greenpeace, Corona, Budweiser y Oxfam." />
    <!-- Las vistas previas (LinkedIn, WhatsApp, X) necesitan URL absoluta y una imagen de 1200×630. -->
    <meta property="og:image" content="https://carlos-rabago.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://carlos-rabago.netlify.app/og-image.jpg" />
    <title>Carlos Rábago — Desarrollador Frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detecta este formulario al publicar (la app lo pinta con React, así que
         Netlify no lo vería). Los nombres de los campos deben coincidir con ContactForm.jsx. -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="lang" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
